AWSTemplateFormatVersion: '2010-09-09'
Description: Private regional artifact bucket for reproducible ClearPath Lambda deployments; retain packages for rollback.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
Resources:
  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Separate bootstrap stack breaks the dependency between the first Lambda ZIP upload and application stack creation.
        must:
          - Keep this bucket in the same AWS region as Lambda.
          - Retained packages require separate owner cleanup after stack deletion.
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldPackages
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  ArtifactPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Artifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt Artifacts.Arn
              - !Sub '${Artifacts.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
Outputs:
  ArtifactBucket:
    Description: Private S3 bucket for Lambda ZIP uploads.
    Value: !Ref Artifacts
